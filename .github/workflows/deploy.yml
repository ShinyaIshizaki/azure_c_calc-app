name: Deploy to Azure VM (Secure Dynamic NSG)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Azureへログイン
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 実行中ランナーのグローバルIPを取得
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Azure NSGに一時的アクセス許可を追加
        run: |
          az network nsg rule update \
            --resource-group "azure-linux-vm_グループ" \
            --nsg-name "azure-linux-vm-nsg" \
            --name "SSH" \
            --source-address-prefixes "${{ steps.ip.outputs.ipv4 }}/32" \
            --access Allow

      - name: Azure VM へ SSH 接続して自動デプロイを実行
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            echo "=== Azure VM 上での自動デプロイ開始 ==="
            if [ ! -d "~/azure_c_calc-app" ]; then
              git clone https://github.com/${{ github.repository }}.git ~/azure_c_calc-app
            fi
            cd ~/azure_c_calc-app
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy_local.sh
            ./deploy_local.sh
            echo "=== 自動デプロイ完了 ==="

      - name: 【後処理】Azure NSG の一時許可を閉じる (Deny)
        if: always() # デプロイの成功・失敗にかかわらず確実に実行
        run: |
          az network nsg rule update \
            --resource-group "azure-linux-vm_グループ" \
            --nsg-name "azure-linux-vm-nsg" \
            --name "SSH" \
            --source-address-prefixes "Any" \
            --access Deny