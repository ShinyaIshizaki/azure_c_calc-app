<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C言語CGI Webアプリ - Sprint 2</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background-color: #f4f6f9; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { font-size: 1.2rem; color: #0066cc; margin-top: 0; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; background: #0066cc; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.post { background: #28a745; }
    </style>
</head>
<body>
    <!-- GET フォーム -->
    <div class="card">
        <h1>1. GETメソッドテスト</h1>
        <form action="/cgi-bin/calc.cgi" method="GET">
            <label>数値 A: <input type="number" name="a" value="10" required></label>
            <label>数値 B: <input type="number" name="b" value="20" required></label>
            <button type="submit">GETで送信</button>
        </form>
    </div>

    <!-- POST フォーム -->
    <div class="card">
        <h1>2. POSTメソッドテスト</h1>
        <form action="/cgi-bin/calc.cgi" method="POST">
            <label>数値 A: <input type="number" name="a" value="10" required></label>
            <label>数値 B: <input type="number" name="b" value="20" required></label>
            <button type="submit" class="post">POSTで送信</button>
        </form>
    </div>
</body>
</html>
